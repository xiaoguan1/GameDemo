systemLog:
   destination: file
   path: "/home/game/rsDb/27018/mongod.log"
   logAppend: true
   logRotate: reopen
storage:
   dbPath: "/home/game/rsDb/27018/data"
   journal:
      enabled: true
processManagement:
   fork: true
   pidFilePath: "/home/game/rsDb/27018/mongod.pid"
net:
   bindIp: 0.0.0.0
   port: 27018
replication:
  replSetName: "ggw"
  oplogSizeMB: 991   # 从4.4版本开始 默认为990MB，最大可设置1PB。注意：一旦完成初次启动则后续只能通过命令进行更改